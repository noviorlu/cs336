# CS336 Assignment 1
# 7.2.1 Hyperparameter tuning: TinyStories 17M model (Tuned Version)

# Data params
train_data: "data/tinystories_train.npy"
val_data: "data/tinystories_valid.npy"
checkpoint_dir: "checkpoints/tinystories_17M_tuned"

# Model hyperparameters (from PDF 7.2.1)
vocab_size: 10000
context_length: 256
d_model: 512
num_layers: 4
num_heads: 16
d_ff: 1344
rope_theta: 10000.0

# Optimization hyperparameters
batch_size: 256
max_iters: 5000

# -----------------
# TUNED HYPERPARAMS
# -----------------
# 1. Higher learning rate (1e-3 instead of 5e-4) for this smaller 17M model
learning_rate: 1.0e-3
min_lr: 1.0e-5
# 2. Slightly longer warmup to stabilize the higher learning rate
warmup_iters: 200
# 3. Lower weight decay (0.01 instead of 0.1) since we don't want to overly constrain a small model
weight_decay: 0.01
max_grad_norm: 1.0
seed: 1337

# Logging and Evaluation
eval_interval: 0
eval_iters: 20
log_interval: 0
device: "cuda"
dtype: "bfloat16"
compile: true
